[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "phosphor2000"
version = "0.1.0"
description = "Distributed offline retro-green CRT visual system for Raspberry Pi 3 clusters"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
# Versions are pinned to the exact set exercised by the test suite.
# All of them ship aarch64 manylinux wheels (64-bit Raspberry Pi OS Lite).
dependencies = [
  "fastapi==0.165.0",
  "uvicorn==0.54.0",
  "websockets==17.4",
  "pydantic==2.14.4",
  "PyYAML==6.0.4",
  "numpy==2.4.6",
]

[project.optional-dependencies]
audio = ["sounddevice==0.5.2"]
dev = ["pytest==9.2.0", "pytest-asyncio==1.5.0", "httpx==0.28.1"]

[project.scripts]
phosphor-core = "backend.services.core:main"
phosphor-audio = "backend.audio.service:main"
phosphor-input = "backend.services.input_service:main"
phosphor-sim = "backend.cluster.simulation:main"
phosphor-passwd = "backend.api.auth:passwd_main"

[tool.setuptools.packages.find]
include = ["backend*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = ["slow: long-running simulation tests"]
